<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="./images/1.jpg">
  <title>Nature Chille</title>

  <!-- Bootstrap CSS & JS -->
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" async></script>

   <!-- Our custom CSS & JS -->
    <link rel="stylesheet" href="./style.css">
  </head>
<body>
  <div class="container-fluid nature-chill">
    <video id="background-video" autoplay loop muted>
      <source src="./video/nature-02.mp4" type="video/mp4">
    </video>
    
    <div class="row">
      <div class="col-lg-12">
        <div class="login-box">
          <div class="col-lg-12 login-title">
            Nature Chill
          </div>
          <div class="col-lg-12 login-form">
            <form>
              <div class="form-group">
                <label for="" class="form-control-label">Username:</label>
                <input type="text" class="form-control" id="username" autocomplete="off">
              </div>
              <!--  -->
              <div class="form-group">
                <label for="" class="form-control-label">Password:</label>
                <input type="password" class="form-control" id="password">
              </div>
              <!--  -->
              <div class="col-lg-12">
                <div class="btn-action">
                  <button class="btn btn-outline-primary" type="button">Login</button>
                  <button class="btn btn-outline-primary" type="button">Register</button>
                </div>
              </div>
            </form> 
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

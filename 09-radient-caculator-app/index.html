<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="./assets/images/product-2.jpg" type="image/x-icon">
  <title>Caculator App</title>

  <!-- add our css & js -->
   <link rel="stylesheet" href="./style.css">
   <script src="./main.js" async></script>
</head>
<body>
  
<div class="container">
  <div class="caculator">

    <!-- Màn hình hiển thị -->
    <div class="input" id="input"></div>

    <!-- Khu vực bàn phím -->
    <div class="buttons">

      <div class="operators">
        <div class="add">+</div>
        <div class="subtract">-</div>
        <div class="multiply">x</div>
        <div class="divide">/</div>
      </div>

      <div class="number-panel">
        <div class="numbers">
          <div>7</div>
          <div>8</div>
          <div>9</div>
        </div>

        <div class="numbers">
          <div>4</div>
          <div>5</div>
          <div>6</div>
        </div>

        <div class="numbers">
          <div>1</div>
          <div>2</div>
          <div>3</div>
        </div>

        <div class="numbers">
          <div>0</div>
          <div>.</div>
          <div id="clear-all">C</div>
        </div>
      </div>
      <div class="equal" id="result">=</div>

    </div>
  </div>
</div>

</body>
</html>

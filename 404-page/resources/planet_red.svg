<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
  <!-- Planet main body -->
  <circle cx="100" cy="100" r="70" fill="#E53935"/>
  
  <!-- Gradient-like shading with overlapping circles for depth -->
  <circle cx="85" cy="85" r="55" fill="#EF5350" opacity="0.6"/>
  <circle cx="75" cy="75" r="35" fill="#FF8A80" opacity="0.4"/>
  
  <!-- Dark side / shadow -->
  <path d="M 100 30 
           A 70 70 0 0 1 100 170 
           A 50 70 0 0 0 100 30 Z" 
        fill="#C62828" opacity="0.35"/>
  
  <!-- Craters -->
  <circle cx="70" cy="60" r="12" fill="#C62828" opacity="0.5"/>
  <circle cx="65" cy="55" r="5" fill="#B71C1C" opacity="0.4"/>
  
  <circle cx="130" cy="70" r="9" fill="#C62828" opacity="0.45"/>
  <circle cx="127" cy="66" r="3.5" fill="#B71C1C" opacity="0.4"/>
  
  <circle cx="90" cy="130" r="14" fill="#C62828" opacity="0.5"/>
  <circle cx="85" cy="124" r="6" fill="#B71C1C" opacity="0.4"/>
  
  <circle cx="140" cy="120" r="8" fill="#C62828" opacity="0.4"/>
  
  <circle cx="55" cy="110" r="7" fill="#C62828" opacity="0.45"/>
  
  <!-- Small highlight -->
  <circle cx="70" cy="55" r="8" fill="white" opacity="0.25"/>
  
  <!-- Thin ring (optional decorative) -->
  <ellipse cx="100" cy="100" rx="90" ry="18" fill="none" stroke="#FFCDD2" stroke-width="3" opacity="0.6" transform="rotate(-15 100 100)"/>
  <ellipse cx="100" cy="100" rx="90" ry="18" fill="none" stroke="#EF9A9A" stroke-width="1.5" opacity="0.4" transform="rotate(-15 100 100)"/>
</svg>

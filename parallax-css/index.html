    <!-- 
    1\. Hiệu ứng Parallax là gì?
    Khái niệm: Đây là kỹ thuật làm cho các hình ảnh nền (**Background**) hoặc các lớp nội dung di chuyển với **tốc độ khác nhau** khi người dùng cuộn trang web.
    Tác dụng: Giúp tạo ra **cảm giác có chiều sâu 3D** cho thị giác của người xem, làm cho trang web trở nên bắt mắt, thu hút và sinh động hơn (đặc biệt rất phổ biến trên các trang **Landing Page**).
    -->
    <!-- 
    Chúng ta sẽ sử dụng 3 thuộc tính CSS là:
        perspective để tăng khoảng cách, 
        transform: translateZ() kết hợp scale() trên không gian 3d: transform-style: preserve-3d;
